version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucas-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - lucas-network

  postgres:
    image: postgres:15-alpine
    container_name: lucas-db
    environment:
      - POSTGRES_USER=lucas
      - POSTGRES_PASSWORD=lucas
      - POSTGRES_DB=lucas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lucas-network

networks:
  lucas-network:
    driver: bridge

volumes:
  postgres-data:
